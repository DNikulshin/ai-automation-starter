repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b5
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings]
        args: [
          "--max-line-length=120",
          "--ignore=D100,D101,D102,D103,D104,D105,D106,D107,D205,D400,F401,W503",
        ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML, pydantic]
        args: ["--ignore-missing-imports", "--follow-imports=silent", "--no-strict-optional"]
